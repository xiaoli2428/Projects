name: Python Package using Conda

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up conda
        uses: conda-incubator/setup-miniconda@v2
        with:
          auto-update-conda: true
          python-version: 3.10
          activate-environment: ci-env
          miniforge-variant: Mambaforge

      - name: Install dependencies (environment.yml or requirements.txt)
        shell: bash -l {0}
        run: |
          # If an environment.yml exists at the repo root, use it.
          if [ -f "./environment.yml" ]; then
            echo "Found environment.yml at repo root — creating/updating conda env from it"
            # Try to update the environment; if update fails, create it
            conda env update -n ci-env -f environment.yml || conda env create -n ci-env -f environment.yml
            # Ensure conda is activated in this step
            source "$(conda info --base)/etc/profile.d/conda.sh"
            conda activate ci-env
          elif [ -f "./requirements.txt" ]; then
            echo "No environment.yml found — installing via pip from requirements.txt"
            python -m pip install --upgrade pip
            pip install -r requirements.txt
          else
            echo "No environment.yml or requirements.txt found — proceeding with Python only"
          fi

      - name: Run tests
        shell: bash -l {0}
        run: |
          # Ensure pytest is available (installed either by conda env or pip install)
          python -m pytest -q || echo "pytest run finished (exit code above indicates test failures)"

      # Add any further steps here (lint, build, publish, etc.)